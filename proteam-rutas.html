<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Proteam — Rutas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
  
  .screen { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
  .screen.active { display: flex; }

  .header { background: #1a472a; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .header-back { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 2px 8px; line-height: 1; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }

  .scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* PANTALLA RUTAS */
  .ruta-selector { padding: 20px 16px; }
  .ruta-selector h2 { font-size: 14px; color: #666; margin-bottom: 16px; font-weight: 400; }
  .ruta-btn { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid #e0e0e0; border-radius: 12px; background: #fff; margin-bottom: 12px; cursor: pointer; text-align: left; -webkit-appearance: none; }
  .ruta-btn:active { background: #f0f7f2; }
  .ruta-icon { width: 44px; height: 44px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .ruta-info strong { display: block; font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .ruta-info span { font-size: 13px; color: #888; }
  .ruta-count { margin-left: auto; background: #1a472a; color: #fff; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 20px; min-width: 36px; text-align: center; }

  /* PANTALLA CLIENTES */
  .progress-bar { height: 4px; background: #e0e0e0; flex-shrink: 0; }
  .progress-fill { height: 100%; background: #1a472a; transition: width 0.4s ease; }

  .cliente-item { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 12px; cursor: pointer; background: #fff; }
  .cliente-item:active { background: #f5f5f5; }
  .cliente-avatar { width: 42px; height: 42px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #1a472a; flex-shrink: 0; }
  .cliente-avatar.marcado { background: #c8e6c9; }
  .cliente-info { flex: 1; min-width: 0; }
  .cliente-info strong { display: block; font-size: 14px; font-weight: 600; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cliente-info span { font-size: 12px; color: #888; }
  .cliente-status { font-size: 22px; flex-shrink: 0; }

  .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 60px 20px; color: #888; font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1a472a; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 60px 20px; color: #aaa; font-size: 14px; text-align: center; }
  .empty-icon { font-size: 40px; }

  /* PANTALLA MAPA */
  .map-wrapper { flex: 1; position: relative; overflow: hidden; }
  
  .map-overlay-top { position: absolute; top: 0; left: 0; right: 0; background: #fff; padding: 12px 16px; border-bottom: 1px solid #e8e8e8; z-index: 20; }
  .cliente-map-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .cliente-map-city { font-size: 12px; color: #888; margin-top: 2px; }
  .ya-tiene-ubic { font-size: 11px; color: #1a472a; margin-top: 3px; }

  #map { width: 100%; height: 100%; }

  .map-bottom { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; padding: 14px 16px 20px; border-top: 1px solid #e8e8e8; z-index: 20; }
  .coords-display { font-size: 12px; color: #888; margin-bottom: 10px; font-family: monospace; }
  .save-btn { width: 100%; padding: 15px; background: #1a472a; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .save-btn:disabled { background: #ccc; color: #888; }
  .save-btn:active:not(:disabled) { background: #155222; }

  .map-btn-gps { position: absolute; right: 14px; top: 80px; z-index: 20; width: 42px; height: 42px; background: #fff; border: 1px solid #ddd; border-radius: 8px; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a472a; color: #fff; padding: 11px 22px; border-radius: 24px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; z-index: 999; }
  .toast.show { opacity: 1; }

  .nuevo-btn { margin: 12px 16px; padding: 13px; border: 2px dashed #1a472a; border-radius: 10px; background: transparent; color: #1a472a; font-size: 14px; font-weight: 600; cursor: pointer; width: calc(100% - 32px); display: block; }
</style>
</head>
<body>

<!-- PANTALLA 1: SELECCIÓN DE RUTA -->
<div id="screen-rutas" class="screen active">
  <div class="header">
    <div>
      <h1>🥩 Proteam — Rutas</h1>
      <div class="header-sub">Selecciona tu ruta del día</div>
    </div>
  </div>
  <div class="scroll-area">
    <div class="ruta-selector">
      <h2>¿Cuál ruta vas a hacer hoy?</h2>
      <button class="ruta-btn" onclick="seleccionarRuta('UC_A9EFPQ','Ruta 1')">
        <div class="ruta-icon">🚚</div>
        <div class="ruta-info"><strong>Ruta 1</strong><span>Clientes del día</span></div>
        <div class="ruta-count" id="count-r1">…</div>
      </button>
      <button class="ruta-btn" onclick="seleccionarRuta('UC_0DH0L0','Ruta 2')">
        <div class="ruta-icon">🚛</div>
        <div class="ruta-info"><strong>Ruta 2</strong><span>Clientes del día</span></div>
        <div class="ruta-count" id="count-r2">…</div>
      </button>
      <button class="ruta-btn" onclick="seleccionarRuta('UC_V2203A','Ruta 3')">
        <div class="ruta-icon">🏍️</div>
        <div class="ruta-info"><strong>Ruta 3</strong><span>Clientes del día</span></div>
        <div class="ruta-count" id="count-r3">…</div>
      </button>
    </div>
  </div>
</div>

<!-- PANTALLA 2: LISTA DE CLIENTES -->
<div id="screen-clientes" class="screen">
  <div class="header">
    <button class="header-back" onclick="showScreen('screen-rutas')">←</button>
    <div>
      <h1 id="lista-title">Ruta</h1>
      <div class="header-sub" id="lista-sub">Cargando...</div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="scroll-area" id="clientes-container"></div>
</div>

<!-- PANTALLA 3: MAPA -->
<div id="screen-mapa" class="screen">
  <div class="header">
    <button class="header-back" onclick="showScreen('screen-clientes')">←</button>
    <div>
      <h1>Capturar ubicación</h1>
      <div class="header-sub">Mueve el pin al punto exacto</div>
    </div>
  </div>
  <div class="map-wrapper">
    <div class="map-overlay-top">
      <div class="cliente-map-name" id="map-nombre"></div>
      <div class="cliente-map-city" id="map-ciudad"></div>
      <div class="ya-tiene-ubic" id="map-ubic-prev"></div>
    </div>
    <div id="map"></div>
    <button class="map-btn-gps" onclick="centerGPS()" title="Mi ubicación">📍</button>
    <div class="map-bottom">
      <div class="coords-display" id="coords-display">Obteniendo GPS...</div>
      <button class="save-btn" id="save-btn" onclick="guardarUbicacion()" disabled>Guardar ubicación</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Leaflet (mapa real, libre de costo, sin API key) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const BASE = 'https://mayoristapip.bitrix24.co/rest/1/3f5r2cx2hfv0r9ve';

let clientes = [];
let clienteActual = null;
let gpsLat = null, gpsLon = null;
let pinLat = null, pinLon = null;
let completados = new Set();
let leafletMap = null;
let marker = null;
let gpsMarker = null;
let mapIniciado = false;

// ─── NAVEGACIÓN ───────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'screen-mapa' && !mapIniciado) initMap();
  if (id === 'screen-mapa') setTimeout(() => leafletMap && leafletMap.invalidateSize(), 100);
}

// ─── TOAST ────────────────────────────────────────
function showToast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ─── MAPA LEAFLET ─────────────────────────────────
function initMap() {
  mapIniciado = true;
  const lat = gpsLat || 8.7575;
  const lon = gpsLon || -75.8811;
  leafletMap = L.map('map', { zoomControl: true }).setView([lat, lon], 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(leafletMap);

  const redIcon = L.divIcon({
    html: '<div style="width:28px;height:28px;background:#e53935;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>',
    iconSize: [28, 28],
    iconAnchor: [14, 28],
    className: ''
  });

  marker = L.marker([lat, lon], { icon: redIcon, draggable: true }).addTo(leafletMap);
  marker.on('dragend', function(e) {
    const pos = e.target.getLatLng();
    pinLat = pos.lat;
    pinLon = pos.lng;
    actualizarCoords();
  });

  leafletMap.on('click', function(e) {
    pinLat = e.latlng.lat;
    pinLon = e.latlng.lng;
    marker.setLatLng([pinLat, pinLon]);
    actualizarCoords();
  });
}

function centerGPS() {
  navigator.geolocation.getCurrentPosition(pos => {
    gpsLat = pos.coords.latitude;
    gpsLon = pos.coords.longitude;
    pinLat = gpsLat;
    pinLon = gpsLon;
    if (leafletMap) {
      leafletMap.setView([gpsLat, gpsLon], 18);
      marker.setLatLng([gpsLat, gpsLon]);
    }
    actualizarCoords();
    document.getElementById('save-btn').disabled = false;
  }, () => showToast('No se pudo obtener el GPS'), { enableHighAccuracy: true });
}

function actualizarCoords() {
  if (pinLat && pinLon) {
    document.getElementById('coords-display').textContent = `${pinLat.toFixed(6)}, ${pinLon.toFixed(6)}`;
    document.getElementById('save-btn').disabled = false;
  }
}

// ─── CARGAR CONTEOS ───────────────────────────────
async function cargarConteos() {
  const rutas = [
    { id: 'UC_A9EFPQ', el: 'count-r1' },
    { id: 'UC_0DH0L0', el: 'count-r2' },
    { id: 'UC_V2203A', el: 'count-r3' }
  ];
  for (const r of rutas) {
    try {
      const res = await fetch(`${BASE}/crm.deal.list.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filter: { CATEGORY_ID: '0', STAGE_ID: r.id }, select: ['ID'] })
      });
      const data = await res.json();
      document.getElementById(r.el).textContent = (data.result || []).length;
    } catch(e) {
      document.getElementById(r.el).textContent = '?';
    }
  }
}

// ─── SELECCIONAR RUTA ─────────────────────────────
async function seleccionarRuta(stageId, nombre) {
  completados = new Set();
  document.getElementById('lista-title').textContent = nombre;
  document.getElementById('lista-sub').textContent = 'Cargando...';
  document.getElementById('clientes-container').innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Consultando Bitrix...</span></div>';
  showScreen('screen-clientes');

  try {
    const res = await fetch(`${BASE}/crm.deal.list.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filter: { CATEGORY_ID: '0', STAGE_ID: stageId },
        select: ['ID', 'TITLE', 'CONTACT_ID']
      })
    });
    const data = await res.json();
    const deals = data.result || [];

    if (!deals.length) {
      document.getElementById('clientes-container').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><span>Sin clientes en esta ruta hoy</span></div>';
      document.getElementById('lista-sub').textContent = '0 clientes';
      return;
    }

    // Cargar datos de contactos en batch
    const contactIds = [...new Set(deals.map(d => d.CONTACT_ID).filter(Boolean))];
    const contactMap = {};
    const chunkSize = 50;

    for (let i = 0; i < contactIds.length; i += chunkSize) {
      const slice = contactIds.slice(i, i + chunkSize);
      const cmds = {};
      slice.forEach((cid, idx) => {
        cmds[`c${idx}`] = `crm.contact.get?id=${cid}&select[]=NAME&select[]=LAST_NAME&select[]=UF_CRM_1709759251514&select[]=UF_CRM_LAT&select[]=UF_CRM_LON`;
      });
      const bRes = await fetch(`${BASE}/batch.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ halt: 0, cmd: cmds })
      });
      const bData = await bRes.json();
      const results = bData.result?.result || {};
      slice.forEach((cid, idx) => {
        const c = results[`c${idx}`] || {};
        contactMap[String(cid)] = {
          nombre: [c.NAME, c.LAST_NAME].filter(Boolean).join(' ') || 'Sin nombre',
          ciudad: c.UF_CRM_1709759251514 || '',
          lat: c.UF_CRM_LAT || null,
          lon: c.UF_CRM_LON || null
        };
      });
    }

    clientes = deals.map(d => ({
      dealId: d.ID,
      contactId: d.CONTACT_ID,
      ...( contactMap[String(d.CONTACT_ID)] || { nombre: d.TITLE, ciudad: '', lat: null, lon: null })
    }));

    renderClientes();
    iniciarGPS();

  } catch(e) {
    document.getElementById('clientes-container').innerHTML = '<div class="empty-state"><div class="empty-icon">📡</div><span>Error al conectar. Verifica tu internet.</span></div>';
  }
}

// ─── RENDERIZAR LISTA ─────────────────────────────
function renderClientes() {
  const total = clientes.length;
  const done = completados.size;
  const pct = total > 0 ? (done / total) * 100 : 0;
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('lista-sub').textContent = `${total} clientes · ${done} marcados hoy`;

  const html = clientes.map(c => {
    const isDone = completados.has(c.dealId);
    const tieneUbic = c.lat && c.lon;
    const iniciales = c.nombre.split(' ').slice(0,2).map(w => w[0]||'').join('').toUpperCase() || '?';
    const estado = isDone ? '✅' : tieneUbic ? '📍' : '⚪';
    return `<div class="cliente-item" onclick="abrirMapa('${c.dealId}')">
      <div class="cliente-avatar ${isDone ? 'marcado' : ''}">${iniciales}</div>
      <div class="cliente-info">
        <strong>${c.nombre}</strong>
        <span>${c.ciudad || 'Sin ciudad'}</span>
      </div>
      <div class="cliente-status">${estado}</div>
    </div>`;
  }).join('');

  document.getElementById('clientes-container').innerHTML = html;
}

// ─── ABRIR MAPA ───────────────────────────────────
function abrirMapa(dealId) {
  clienteActual = clientes.find(c => c.dealId === dealId);
  if (!clienteActual) return;

  document.getElementById('map-nombre').textContent = clienteActual.nombre;
  document.getElementById('map-ciudad').textContent = clienteActual.ciudad || 'Sin ciudad registrada';
  document.getElementById('map-ubic-prev').textContent = (clienteActual.lat && clienteActual.lon)
    ? `📍 Ya tiene ubicación guardada — puedes actualizarla`
    : '';
  document.getElementById('coords-display').textContent = 'Obteniendo GPS...';
  document.getElementById('save-btn').disabled = true;
  pinLat = null; pinLon = null;

  showScreen('screen-mapa');

  // Si ya tiene ubicación, centrar ahí
  if (clienteActual.lat && clienteActual.lon && leafletMap) {
    const lat = parseFloat(clienteActual.lat);
    const lon = parseFloat(clienteActual.lon);
    leafletMap.setView([lat, lon], 18);
    marker.setLatLng([lat, lon]);
    pinLat = lat; pinLon = lon;
    actualizarCoords();
  } else {
    centerGPS();
  }
}

// ─── GPS CONTINUO ─────────────────────────────────
function iniciarGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(pos => {
    gpsLat = pos.coords.latitude;
    gpsLon = pos.coords.longitude;
  }, () => {}, { enableHighAccuracy: true });
}

// ─── GUARDAR UBICACIÓN ────────────────────────────
async function guardarUbicacion() {
  if (!pinLat || !pinLon || !clienteActual) return;
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Guardando...';
  btn.disabled = true;

  try {
    const res = await fetch(`${BASE}/crm.contact.update.json`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: clienteActual.contactId,
        fields: {
          UF_CRM_LAT: String(pinLat.toFixed(6)),
          UF_CRM_LON: String(pinLon.toFixed(6))
        }
      })
    });
    const data = await res.json();

    if (data.result) {
      completados.add(clienteActual.dealId);
      const idx = clientes.findIndex(c => c.dealId === clienteActual.dealId);
      if (idx >= 0) { clientes[idx].lat = pinLat; clientes[idx].lon = pinLon; }
      showToast('✅ Ubicación guardada');
      setTimeout(() => {
        showScreen('screen-clientes');
        renderClientes();
      }, 800);
    } else {
      throw new Error('Bitrix no confirmó');
    }
  } catch(e) {
    showToast('❌ Error al guardar, reintenta');
    btn.textContent = 'Guardar ubicación';
    btn.disabled = false;
  }
}

// ─── INICIO ───────────────────────────────────────
cargarConteos();
iniciarGPS();
</script>
</body>
</html>
