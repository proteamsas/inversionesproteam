<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Proteam — Rutas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; overflow: hidden; }

  .screen { display: none; flex-direction: column; height: 100dvh; }
  .screen.active { display: flex; }

  /* ── LOGIN ── */
  #screen-login {
    background: #1a472a;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }

  .login-box {
    background: #fff;
    border-radius: 20px;
    padding: 36px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }

  .login-logo {
    font-size: 13px;
    color: #888;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .login-title {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 28px;
  }

  .login-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .login-input {
    width: 100%;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 18px;
    letter-spacing: 4px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
    font-family: monospace;
  }
  .login-input:focus { border-color: #1a472a; }

  .login-btn {
    width: 100%;
    background: #1a472a;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .login-btn:active { background: #0f2d1a; }

  .login-error {
    color: #c62828;
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
    display: none;
    font-weight: 500;
  }

  /* HEADER */
  .header { background: #1a472a; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .header-back { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; padding: 2px 8px; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }

  .scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* RUTAS */
  .ruta-selector { padding: 20px 16px; }
  .ruta-selector h2 { font-size: 14px; color: #666; margin-bottom: 16px; }
  .ruta-btn { width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid #e0e0e0; border-radius: 12px; background: #fff; margin-bottom: 12px; cursor: pointer; text-align: left; }
  .ruta-btn:active { background: #f0f7f2; }
  .ruta-icon { width: 44px; height: 44px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .ruta-info strong { display: block; font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .ruta-info span { font-size: 13px; color: #888; }
  .ruta-count { margin-left: auto; background: #1a472a; color: #fff; font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 20px; min-width: 36px; text-align: center; }

  /* CLIENTES */
  .progress-bar { height: 4px; background: #e0e0e0; flex-shrink: 0; }
  .progress-fill { height: 100%; background: #1a472a; transition: width 0.4s; }
  .cliente-item { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 12px; cursor: pointer; background: #fff; }
  .cliente-item:active { background: #f5f5f5; }
  .cliente-avatar { width: 42px; height: 42px; border-radius: 50%; background: #e8f5e9; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #1a472a; flex-shrink: 0; }
  .cliente-avatar.marcado { background: #c8e6c9; }
  .cliente-info { flex: 1; min-width: 0; }
  .cliente-info strong { display: block; font-size: 14px; font-weight: 600; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cliente-info span { font-size: 12px; color: #888; }
  .cliente-status { font-size: 22px; flex-shrink: 0; }
  .nav-btn { background: #e8f5e9; border: 1px solid #1a472a; border-radius: 8px; font-size: 18px; padding: 6px 10px; cursor: pointer; flex-shrink: 0; margin-right: 4px; }
  .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 60px 20px; color: #888; font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #e0e0e0; border-top-color: #1a472a; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 60px 20px; color: #aaa; font-size: 14px; text-align: center; }

  /* MAPA */
  #screen-mapa { overflow: hidden; }
  .map-header-info { background: #fff; padding: 8px 16px; border-bottom: 1px solid #eee; flex-shrink: 0; }
  .map-header-info .hint { font-size: 11px; color: #999; margin-top: 2px; }
  .map-header-info .ya-ubic { font-size: 11px; color: #1a472a; }
  #map { flex: 1; min-height: 0; width: 100%; }

  .bottom-bar {
    flex-shrink: 0;
    background: #fff;
    border-top: 2px solid #e0e0e0;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
  }

  .coords-row { display: flex; align-items: center; justify-content: space-between; }
  .coords-display { font-size: 12px; color: #555; font-family: monospace; font-weight: 500; }
  .gps-btn { background: #e8f5e9; border: 1px solid #1a472a; border-radius: 8px; color: #1a472a; font-size: 13px; font-weight: 600; padding: 7px 14px; cursor: pointer; }

  .save-btn {
    width: 100%; padding: 15px; background: #2e7d32; color: #fff; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer;
    letter-spacing: 0.3px; box-shadow: 0 4px 12px rgba(46,125,50,0.45);
  }
  .save-btn:disabled { background: #bbb; color: #fff; box-shadow: none; }
  .save-btn:active:not(:disabled) { background: #1b5e20; transform: scale(0.98); }

  /* WAZE DIRECTO (cliente ya tiene ubicación) */
  .waze-directo {
    width: 100%; padding: 15px; background: #00b4d8; color: #fff; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer;
    letter-spacing: 0.3px; box-shadow: 0 4px 12px rgba(0,180,216,0.4);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    text-decoration: none;
  }
  .waze-directo:active { opacity: 0.85; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a472a; color: #fff; padding: 11px 22px; border-radius: 24px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; z-index: 9999; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- PANTALLA 0: LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-box">
    <div class="login-logo">Inversiones Proteam</div>
    <div class="login-title">🥩 App de Rutas</div>
    <div class="login-label">Ingresa tu clave de ruta</div>
    <input type="password" class="login-input" id="pinInput" placeholder="••••••••••"
      onkeydown="if(event.key==='Enter') verificarPin()">
    <button class="login-btn" onclick="verificarPin()">Entrar</button>
    <div class="login-error" id="loginError">❌ Clave incorrecta. Intenta de nuevo.</div>
  </div>
</div>

<!-- PANTALLA 1: RUTAS -->
<div id="screen-rutas" class="screen">
  <div class="header">
    <div><h1>🥩 Proteam — <span id="header-ruta-nombre">Rutas</span></h1><div class="header-sub">Selecciona tu ruta del día</div></div>
  </div>
  <div class="scroll-area">
    <div class="ruta-selector">
      <h2 id="rutas-saludo">¿Cuál ruta vas a hacer hoy?</h2>
      <!-- Se llena dinámicamente según el PIN -->
      <div id="rutas-container"></div>
    </div>
  </div>
</div>

<!-- PANTALLA 2: CLIENTES -->
<div id="screen-clientes" class="screen">
  <div class="header">
    <button class="header-back" onclick="showScreen('screen-rutas')">←</button>
    <div><h1 id="lista-title">Ruta</h1><div class="header-sub" id="lista-sub">Cargando...</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
  <div class="scroll-area" id="clientes-container"></div>
</div>

<!-- PANTALLA 3: MAPA (solo para clientes sin ubicación) -->
<div id="screen-mapa" class="screen">
  <div class="header">
    <button class="header-back" onclick="showScreen('screen-clientes')">←</button>
    <div><h1 id="map-nombre">Cliente</h1><div class="header-sub" id="map-ciudad">Ciudad</div></div>
  </div>
  <div class="map-header-info">
    <div class="hint">📍 Toca el mapa o arrastra el pin para ajustar la ubicación</div>
  </div>
  <div id="map"></div>
  <div class="bottom-bar">
    <div class="coords-row">
      <div class="coords-display" id="coords-display">⏳ Obteniendo GPS...</div>
      <button class="gps-btn" onclick="centerGPS()">📡 Mi GPS</button>
    </div>
    <button class="save-btn" id="save-btn" onclick="guardarUbicacion()" disabled>✅ Guardar ubicación</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = 'https://mayoristapip.bitrix24.co/rest/1/3f5r2cx2hfv0r9ve';
const LAT_FIELD = 'UF_CRM_LAT';
const LON_FIELD = 'UF_CRM_LON';

// ── CONFIGURACIÓN DE ACCESOS ──
// Cada PIN da acceso a una o más rutas
const ACCESOS = {
  'ruta1-2026': {
    nombre: 'Ruta 1',
    rutas: [{ stageId: 'UC_A9EFPQ', nombre: 'Ruta 1', icono: '🚚', countId: 'r1' }]
  },
  'ruta2-2026': {
    nombre: 'Ruta 2',
    rutas: [{ stageId: 'UC_0DH0L0', nombre: 'Ruta 2', icono: '🚛', countId: 'r2' }]
  },
  'ruta3-2026': {
    nombre: 'Ruta 3',
    rutas: [{ stageId: 'UC_V2203A', nombre: 'Ruta 3', icono: '🏍️', countId: 'r3' }]
  }
};

let accesoActual = null;
let leafletMap, marker, mapIniciado = false;
let clientes = [], clienteActual = null, completados = new Set();
let pinLat = null, pinLon = null, gpsLat = null, gpsLon = null;

// ── LOGIN ──
function verificarPin() {
  const pin = document.getElementById('pinInput').value.trim();
  const acceso = ACCESOS[pin];
  if (acceso) {
    accesoActual = acceso;
    document.getElementById('loginError').style.display = 'none';
    construirPantallaRutas(acceso);
    showScreen('screen-rutas');
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('pinInput').value = '';
    document.getElementById('pinInput').focus();
  }
}

function construirPantallaRutas(acceso) {
  document.getElementById('header-ruta-nombre').textContent = acceso.nombre;
  const container = document.getElementById('rutas-container');
  container.innerHTML = acceso.rutas.map(r => `
    <button class="ruta-btn" onclick="seleccionarRuta('${r.stageId}','${r.nombre}')">
      <div class="ruta-icon">${r.icono}</div>
      <div class="ruta-info"><strong>${r.nombre}</strong><span>Clientes del día</span></div>
      <div class="ruta-count" id="count-${r.countId}">…</div>
    </button>
  `).join('');
  // Cargar conteos solo para las rutas del acceso
  acceso.rutas.forEach(r => cargarConteo(r.stageId, r.countId));

  // Si solo tiene una ruta, entrar directo sin mostrar selector
  if (acceso.rutas.length === 1) {
    const r = acceso.rutas[0];
    setTimeout(() => seleccionarRuta(r.stageId, r.nombre), 100);
  }
}

// ── NAVEGACIÓN ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const screen = document.getElementById(id);
  screen.classList.add('active');
  if (id === 'screen-mapa') {
    if (!mapIniciado) initMap();
    else setTimeout(() => leafletMap && leafletMap.invalidateSize(), 100);
  }
}

function showToast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// ── CONTEOS ──
async function cargarConteo(stageId, countId) {
  try {
    const r = await fetch(`${BASE}/crm.deal.list.json`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filter: { CATEGORY_ID: '0', STAGE_ID: stageId }, select: ['ID'] })
    });
    document.getElementById(`count-${countId}`).textContent = ((await r.json()).result || []).length;
  } catch (e) {
    document.getElementById(`count-${countId}`).textContent = '?';
  }
}

// ── CLIENTES ──
async function seleccionarRuta(stageId, nombre) {
  completados = new Set();
  document.getElementById('lista-title').textContent = nombre;
  document.getElementById('lista-sub').textContent = 'Cargando...';
  document.getElementById('clientes-container').innerHTML = '<div class="loading-state"><div class="spinner"></div><span>Consultando Bitrix...</span></div>';
  showScreen('screen-clientes');
  try {
    const res = await fetch(`${BASE}/crm.deal.list.json`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filter: { CATEGORY_ID: '0', STAGE_ID: stageId }, select: ['ID', 'TITLE', 'CONTACT_ID'] })
    });
    const deals = (await res.json()).result || [];
    if (!deals.length) {
      document.getElementById('clientes-container').innerHTML = '<div class="empty-state"><div style="font-size:40px">📋</div><span>Sin clientes en esta ruta hoy</span></div>';
      document.getElementById('lista-sub').textContent = '0 clientes'; return;
    }
    const cids = [...new Set(deals.map(d => d.CONTACT_ID).filter(Boolean))];
    const cmap = {};
    for (let i = 0; i < cids.length; i += 50) {
      const sl = cids.slice(i, i + 50), cmds = {};
      sl.forEach((cid, idx) => {
        cmds[`c${idx}`] = `crm.contact.get?id=${cid}&select[]=NAME&select[]=LAST_NAME&select[]=UF_CRM_1709759251514&select[]=${LAT_FIELD}&select[]=${LON_FIELD}`;
      });
      const bd = await (await fetch(`${BASE}/batch.json`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ halt: 0, cmd: cmds })
      })).json();
      const results = bd.result?.result || {};
      sl.forEach((cid, idx) => {
        const c = results[`c${idx}`] || {};
        cmap[String(cid)] = {
          nombre: [c.NAME, c.LAST_NAME].filter(Boolean).join(' ') || 'Sin nombre',
          ciudad: c.UF_CRM_1709759251514 || '',
          lat: c[LAT_FIELD] || null,
          lon: c[LON_FIELD] || null
        };
      });
    }
    clientes = deals.map(d => ({
      dealId: d.ID, contactId: d.CONTACT_ID,
      ...(cmap[String(d.CONTACT_ID)] || { nombre: d.TITLE, ciudad: '', lat: null, lon: null })
    }));
    renderClientes();
    iniciarGPS();
  } catch (e) {
    document.getElementById('clientes-container').innerHTML = '<div class="empty-state"><div style="font-size:40px">📡</div><span>Error de conexión</span></div>';
  }
}

function renderClientes() {
  const total = clientes.length, done = completados.size;
  document.getElementById('progress').style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
  document.getElementById('lista-sub').textContent = `${total} clientes · ${done} marcados`;
  document.getElementById('clientes-container').innerHTML = clientes.map(c => {
    const isDone = completados.has(c.dealId);
    const tieneUbic = c.lat && c.lon;
    const ini = c.nombre.split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';

    // Si ya tiene ubicación: solo botón Waze, sin abrir mapa
    const accion = tieneUbic
      ? `onclick="navegarWaze(${c.lat},${c.lon},event)"`
      : `onclick="abrirMapa('${c.dealId}')"`;

    const btnNav = tieneUbic
      ? `<button class="nav-btn" ${accion}>🗺️ Waze</button>`
      : '';

    const status = isDone ? '✅' : tieneUbic ? '📍' : '⚪';

    return `<div class="cliente-item" ${tieneUbic ? '' : `onclick="abrirMapa('${c.dealId}')"`}>
      <div class="cliente-avatar ${isDone ? 'marcado' : ''}">${ini}</div>
      <div class="cliente-info"><strong>${c.nombre}</strong><span>${c.ciudad || 'Sin ciudad'}</span></div>
      ${btnNav}
      <div class="cliente-status">${status}</div>
    </div>`;
  }).join('');
}

function navegarWaze(lat, lon, e) {
  if (e) e.stopPropagation();
  window.open(`https://waze.com/ul?ll=${lat},${lon}&navigate=yes`, '_blank');
}

// ── MAPA (solo clientes sin ubicación) ──
function initMap() {
  mapIniciado = true;
  const lat = gpsLat || 8.7575, lon = gpsLon || -75.8811;
  leafletMap = L.map('map', { zoomControl: true }).setView([lat, lon], 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(leafletMap);
  const icon = L.divIcon({
    html: '<div style="width:34px;height:34px;background:#e53935;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,0.4)"></div>',
    iconSize: [34, 34], iconAnchor: [17, 34], className: ''
  });
  marker = L.marker([lat, lon], { icon, draggable: true }).addTo(leafletMap);
  marker.on('drag dragend', e => { const p = e.target.getLatLng(); pinLat = p.lat; pinLon = p.lng; actualizarCoords(); });
  leafletMap.on('click', e => { pinLat = e.latlng.lat; pinLon = e.latlng.lng; marker.setLatLng([pinLat, pinLon]); actualizarCoords(); });
  setTimeout(() => leafletMap.invalidateSize(), 200);
}

function centerGPS() {
  showToast('📡 Obteniendo GPS...', 4000);
  navigator.geolocation.getCurrentPosition(pos => {
    gpsLat = pos.coords.latitude; gpsLon = pos.coords.longitude;
    pinLat = gpsLat; pinLon = gpsLon;
    if (leafletMap) { leafletMap.setView([gpsLat, gpsLon], 18); marker.setLatLng([gpsLat, gpsLon]); }
    actualizarCoords();
  }, () => showToast('❌ No se pudo obtener GPS'), { enableHighAccuracy: true, timeout: 10000 });
}

function actualizarCoords() {
  if (pinLat && pinLon) {
    document.getElementById('coords-display').textContent = `✅ ${pinLat.toFixed(6)}, ${pinLon.toFixed(6)}`;
    document.getElementById('save-btn').disabled = false;
  }
}

function abrirMapa(dealId) {
  clienteActual = clientes.find(c => c.dealId === dealId);
  if (!clienteActual) return;
  // Si ya tiene ubicación, no abrir mapa — directo a Waze
  if (clienteActual.lat && clienteActual.lon) {
    navegarWaze(clienteActual.lat, clienteActual.lon, null);
    return;
  }
  document.getElementById('map-nombre').textContent = clienteActual.nombre;
  document.getElementById('map-ciudad').textContent = clienteActual.ciudad || 'Sin ciudad';
  document.getElementById('coords-display').textContent = '⏳ Obteniendo GPS...';
  document.getElementById('save-btn').disabled = true;
  pinLat = null; pinLon = null;
  showScreen('screen-mapa');
  centerGPS();
}

function iniciarGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    pos => { gpsLat = pos.coords.latitude; gpsLon = pos.coords.longitude; },
    () => {}, { enableHighAccuracy: true }
  );
}

async function guardarUbicacion() {
  if (!pinLat || !pinLon || !clienteActual) return;
  const btn = document.getElementById('save-btn');
  btn.textContent = 'Guardando...'; btn.disabled = true;
  try {
    const res = await fetch('https://proteamsas.app.n8n.cloud/webhook/guardar-ubicacion', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contactId: clienteActual.contactId, lat: pinLat.toFixed(6), lon: pinLon.toFixed(6) })
    });
    const data = await res.json();
    if (data.ok) {
      completados.add(clienteActual.dealId);
      const idx = clientes.findIndex(c => c.dealId === clienteActual.dealId);
      if (idx >= 0) { clientes[idx].lat = pinLat; clientes[idx].lon = pinLon; }
      showToast('✅ Ubicación guardada');
      setTimeout(() => { showScreen('screen-clientes'); renderClientes(); }, 900);
    } else throw new Error();
  } catch (e) {
    showToast('❌ Error al guardar, reintenta');
    btn.textContent = '✅ Guardar ubicación'; btn.disabled = false;
  }
}

iniciarGPS();
</script>
</body>
</html>
